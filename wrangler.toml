# Wrangler configuration for Cloudflare Pages with Functions
# This file configures the deployment settings and bindings

name = "photography-portfolio"
compatibility_date = "2024-01-01"

# Pages-specific configuration
pages_build_output_dir = "."

# R2 bucket binding
# The R2 bucket must be created in the Cloudflare dashboard first
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "photography-portfolio"

# Environment variables (set these in Cloudflare Dashboard > Pages > Settings > Environment Variables)
# ADMIN_PASSWORD = "your-secure-password"
# ADMIN_SECRET = "your-random-secret-key"

# For local development with wrangler pages dev
[vars]
# These are overridden by environment variables in production
# Do not commit real credentials here

# Build configuration (if using wrangler pages)
# [build]
# command = ""

# Development settings
[dev]
port = 8788
local_protocol = "http"
